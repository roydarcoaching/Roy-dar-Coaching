    // --- Client-Side Salted SHA-256 Hashing ---
    async function hashPassword(plainPassword) {
      const salt = "ROY_DAR_SECURE_SALT_2026";
      const encoder = new TextEncoder();
      const data = encoder.encode(plainPassword + salt);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function getCleanYouTubeEmbed(url) {
      if (!url) return null;
      let videoId = "";
      if (url.includes("youtu.be/")) {
        videoId = url.split("youtu.be/")[1]?.split("?")[0];
      } else if (url.includes("watch?v=")) {
        videoId = url.split("watch?v=")[1]?.split("&")[0];
      } else if (url.includes("embed/")) {
        videoId = url.split("embed/")[1]?.split("?")[0];
      }
      return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1` : null;
    }

              <input
                type="text"
                className="input-field"
                placeholder="Student Name"
                value={newStudentName}
                onChange={e => setNewStudentName(e.target.value)}
              />
              <input
                type="text"
                className="input-field"
                placeholder="Mobile / ID (e.g., 6296388399)"
                value={newStudentPhone}
                onChange={e => setNewStudentPhone(e.target.value)}
              />
              <input
                type="text"
                className="input-field"
                placeholder="Initial Password"
                value={newStudentPass}
                onChange={e => setNewStudentPass(e.target.value)}
              />
              <button type="submit" className="btn-primary">
                + Register Student
              </button>
            </form>

            <h5 style={{ fontSize: 13, color: '#fff', margin: '14px 0 8px 0' }}>Student List</h5>
            {Object.keys(studentsList).map(phone => {
              const s = studentsList[phone];
              return (
                <div key={phone} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
                  <div>
                    <div style={{ fontSize: 13, color: '#fff' }}>{s.name} ({phone})</div>
                    <div style={{ fontSize: 10, color: s.isBlocked ? '#f87171' : '#34d399' }}>
                      Status: {s.isBlocked ? "BLOCKED" : "ACTIVE"}
                    </div>
                  </div>
                  <button
                    className="btn-chip"
                    style={{ background: s.isBlocked ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)', color: s.isBlocked ? '#34d399' : '#f87171' }}
                    onClick={() => handleToggleBlock(phone, s.isBlocked)}
                  >
                    {s.isBlocked ? "Unblock" : "Block"}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );

      return (
        <div id="root">
          {renderHeader()}
          <main className="content-area">
            {activeTab === "classes" && renderClassesTab()}
            {activeTab === "mock" && renderMockTab()}
            {activeTab === "ai" && renderAiTab()}
            {activeTab === "admin" && currentUser.role === "admin" && renderAdminTab()}
          </main>

          {/* Bottom Persistent Navigation */}
          <nav className="bottom-nav">
            <button
              className={`nav-item ${activeTab === 'classes' ? 'active' : ''}`}
              onClick={() => setActiveTab("classes")}
            >
              <span className="nav-icon">📁</span>
              <span>{t.tabClassNotes}</span>
            </button>
            <button
              className={`nav-item ${activeTab === 'mock' ? 'active' : ''}`}
              onClick={() => setActiveTab("mock")}
            >
              <span className="nav-icon">📝</span>
              <span>{t.tabMockTest}</span>
            </button>
            <button
              className={`nav-item ${activeTab === 'ai' ? 'active' : ''}`}
              onClick={() => setActiveTab("ai")}
            >
              <span className="nav-icon">🤖</span>
              <span>{t.tabAiSir}</span>
            </button>
            {currentUser.role === "admin" && (
              <button
                className={`nav-item ${activeTab === 'admin' ? 'active' : ''}`}
                onClick={() => setActiveTab("admin")}
              >
                <span className="nav-icon">⚙️</span>
                <span>{t.adminPanel}</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
