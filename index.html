              placeholder="ছাত্র/ছাত্রীর নাম (Student Name)"
              value={stName}
              onChange={e => setStName(e.target.value)}
            />
            <input
              type="text"
              className="input-field"
              placeholder="স্টুডেন্ট মোবাইল নম্বর বা আইডি"
              value={stPhone}
              onChange={e => setStPhone(e.target.value)}
            />
            <input
              type="text"
              className="input-field"
              placeholder="প্রাথমিক পাসওয়ার্ড (Initial Password)"
              value={stPass}
              onChange={e => setStPass(e.target.value)}
            />
            <button
              className="btn-primary"
              onClick={async () => {
                const ph = stPhone.trim();
                const pw = stPass.trim();
                if (!ph || !pw) return;
                const hashed = await hashSecret(pw);
                const stObj = {
                  name: stName.trim() || "Student",
                  phone: ph,
                  passHash: hashed,
                  isBlocked: false,
                  createdAt: new Date().toLocaleDateString()
                };
                setStudents(prev => ({ ...prev, [ph]: stObj }));
                if (db) db.ref(`app_data_v3/students/${ph}`).set(stObj);
                setStName("");
                setStPhone("");
                setStPass("");
                alert(`Student ID ${ph} created!`);
              }}
            >
              ✅ স্টুডেন্ট অ্যাকাউন্ট তৈরি করুন
            </button>

            <h5 style={{ fontSize: 12.5, color: "var(--accent-orange)", margin: "14px 0 8px 0" }}>
              রেজিস্টার্ড স্টুডেন্ট তালিকা ({Object.keys(students).length}):
            </h5>
            {Object.keys(students).map(ph => {
              const s = students[ph] || {};
              return (
                <div
                  key={ph}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "8px 0",
                    borderBottom: "1px solid rgba(255,255,255,0.08)"
                  }}
                >
                  <div>
                    <div style={{ fontSize: 12.5, fontWeight: 600, color: "#fff" }}>
                      {s.name} ({ph})
                    </div>
                    <div style={{ fontSize: 10.5, color: s.isBlocked ? "#ef4444" : "#10b981" }}>
                      {s.isBlocked ? "🚫 BLOCKED" : "● ACTIVE"}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button
                      className="btn-chip"
                      style={{ color: s.isBlocked ? "#10b981" : "#fca5a5" }}
                      onClick={() => {
                        const next = !s.isBlocked;
                        setStudents(prev => ({ ...prev, [ph]: { ...s, isBlocked: next } }));
                        if (db) db.ref(`app_data_v3/students/${ph}/isBlocked`).set(next);
                      }}
                    >
                      {s.isBlocked ? "Unblock" : "Block"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="glass-card">
            <h4 style={{ fontSize: 14, color: "#fff", marginBottom: 8 }}>
              📝 ৪. নতুন মক টেস্ট তৈরি করুন (Testbook Style)
            </h4>
            <select className="input-field" value={mockCat} onChange={e => setMockCat(e.target.value)}>
              <option value="Foundation Batch Mock">Foundation Batch Mock</option>
              <option value="Practice Batch Mock">Practice Batch Mock</option>
              <option value="Subject / Chapter-wise Mock">Subject / Chapter-wise Mock</option>
              <option value="Full Length Mock Test">Full Length Mock Test</option>
            </select>
            <input
              type="text"
              className="input-field"
              placeholder="মক টেস্টের নাম (যেমন: WBP GK Mock Test 01)"
              value={mockTitle}
              onChange={e => setMockTitle(e.target.value)}
            />
            <input
              type="number"
              className="input-field"
              placeholder="সময় (মিনিট)"
              value={mockDur}
              onChange={e => setMockDur(e.target.value)}
            />
            <input
              type="text"
              className="input-field"
              placeholder="প্রশ্নটি লিখুন (Question)"
              value={qTextBn}
              onChange={e => setQTextBn(e.target.value)}
            />
            <input type="text" className="input-field" placeholder="Option A" value={optA} onChange={e => setOptA(e.target.value)} />
            <input type="text" className="input-field" placeholder="Option B" value={optB} onChange={e => setOptB(e.target.value)} />
            <input type="text" className="input-field" placeholder="Option C" value={optC} onChange={e => setOptC(e.target.value)} />
            <input type="text" className="input-field" placeholder="Option D" value={optD} onChange={e => setOptD(e.target.value)} />
            <select className="input-field" value={correctOpt} onChange={e => setCorrectOpt(e.target.value)}>
              <option value="0">সঠিক উত্তর: Option A</option>
              <option value="1">সঠিক উত্তর: Option B</option>
              <option value="2">সঠিক উত্তর: Option C</option>
              <option value="3">সঠিক উত্তর: Option D</option>
            </select>
            <input
              type="text"
              className="input-field"
              placeholder="উত্তরের ব্যাখ্যা (Explanation)"
              value={qExp}
              onChange={e => setQExp(e.target.value)}
            />
            <button
              className="btn-secondary"
              onClick={() => {
                if (!mockTitle.trim() || !qTextBn.trim()) return;
                const all = toArr(mockTests);
                const existingIdx = all.findIndex(t => t.title.toLowerCase() === mockTitle.trim().toLowerCase());
                const newQ = {
                  id: "q-" + Date.now(),
                  q_bn: qTextBn.trim(),
                  q_en: qTextBn.trim(),
                  opt_bn: [optA || "A", optB || "B", optC || "C", optD || "D"],
                  opt_en: [optA || "A", optB || "B", optC || "C", optD || "D"],
                  ans: Number(correctOpt),
                  exp: qExp.trim()
                };
                if (existingIdx >= 0) {
                  all[existingIdx].questions = [...toArr(all[existingIdx].questions), newQ];
                } else {
                  all.push({
                    id: "mock-" + Date.now(),
                    category: mockCat,
                    title: mockTitle.trim(),
                    durationMins: Number(mockDur) || 10,
                    questions: [newQ]
                  });
                }
                setMockTests([...all]);
                if (db) db.ref("app_data_v3/mockTests").set(all);
                setQTextBn(""); setOptA(""); setOptB(""); setOptC(""); setOptD(""); setQExp("");
                alert("প্রশ্নটি মক টেস্টে যুক্ত হয়েছে!");
              }}
            >
              ➕ মক টেস্টে প্রশ্ন যুক্ত করুন
            </button>
          </div>

          <div className="glass-card">
            <h4 style={{ fontSize: 14, color: "#fff", marginBottom: 8 }}>
              🎨 ৫. অ্যাপের লোগো / আইকন পরিবর্তন করুন
            </h4>
            <label style={{ fontSize: 11.5, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              ফোনের গ্যালারি থেকে লোগো সিলেক্ট করুন:
            </label>
            <input
              type="file"
              accept="image/*"
              className="input-field"
              onChange={handleLogoFileUpload}
            />
            <input
              type="text"
              className="input-field"
              placeholder="অথবা লোগো ইমেজের Direct URL দিন"
              value={logoInput}
              onChange={e => setLogoInput(e.target.value)}
            />
            <div style={{ display: "flex", gap: 8 }}>
              <button
                className="btn-primary"
                onClick={() => {
                  if (!logoInput.trim()) return;
                  setSettings(prev => ({ ...prev, logoUrl: logoInput.trim() }));
                  if (db) db.ref("app_data_v3/settings/logoUrl").set(logoInput.trim());
                  setLogoInput("");
                  alert("App Logo Updated!");
                }}
              >
                Update Logo URL
              </button>
              <button
                className="btn-secondary"
                onClick={() => {
                  setSettings(prev => ({ ...prev, logoUrl: STUDY_APP_LOGO }));
                  if (db) db.ref("app_data_v3/settings/logoUrl").set(STUDY_APP_LOGO);
                }}
              >
                Reset Default Crest
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="app-shell">
          {renderHeader()}
          <main className="content-area">
            {activeTab === "classes" && renderClassesTab()}
            {activeTab === "mock" && renderMockTab()}
            {activeTab === "ai" && renderAiTab()}
            {activeTab === "profile" && renderProfileTab()}
            {activeTab === "admin" && currentUser.role === "admin" && renderAdminTab()}
          </main>

          <nav className="bottom-nav">
            <button
              className={`nav-item ${activeTab === "classes" ? "active" : ""}`}
              onClick={() => setActiveTab("classes")}
            >
              <span className="nav-icon">📁</span>
              <span>{lang === "bn" ? "ক্লাস ও নোটস" : "Classes"}</span>
            </button>
            <button
              className={`nav-item ${activeTab === "mock" ? "active" : ""}`}
              onClick={() => setActiveTab("mock")}
            >
              <span className="nav-icon">📝</span>
              <span>{lang === "bn" ? "মক টেস্ট" : "Mock Test"}</span>
            </button>
            <button
              className={`nav-item ${activeTab === "ai" ? "active" : ""}`}
              onClick={() => setActiveTab("ai")}
            >
              <span className="nav-icon">🤖</span>
              <span>{lang === "bn" ? "AI স্যার" : "AI Sir"}</span>
            </button>
            <button
              className={`nav-item ${activeTab === "profile" ? "active" : ""}`}
              onClick={() => setActiveTab("profile")}
            >
              <span className="nav-icon">🔐</span>
              <span>{lang === "bn" ? "পাসওয়ার্ড" : "Password"}</span>
            </button>
            {currentUser.role === "admin" && (
              <button
                className={`nav-item ${activeTab === "admin" ? "active" : ""}`}
                onClick={() => setActiveTab("admin")}
              >
                <span className="nav-icon">⚙️</span>
                <span>{lang === "bn" ? "অ্যাডমিন" : "Admin"}</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
