<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roy dar Coaching - স্মার্ট স্টাডি পোর্টাল</title>
  
  <style>
    :root {
      --primary: #4338ca;
      --primary-dark: #312e81;
      --primary-light: #e0e7ff;
      --dark: #0f172a;
      --light-bg: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--light-bg); color: var(--dark); padding-bottom: 80px; }

    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; }
    .brand-logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      overflow: hidden;
      border: 2px solid #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title h1 { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .brand-title p { font-size: 11px; color: #cbd5e1; }

    .container { max-width: 1150px; margin: 20px auto; padding: 0 14px; }

    /* অ্যাডমিন বক্স */
    .admin-card-box {
      background: white;
      border: 2px solid #6366f1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08);
    }

    .login-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .login-row input {
      flex: 1;
      min-width: 200px;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .btn-login {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .status-msg {
      font-size: 13px;
      margin-top: 8px;
      font-weight: 600;
    }

    /* মূল অ্যাডমিন কন্ট্রোল প্যানেল */
    #adminMasterArea {
      display: none;
      background: white;
      border: 2px solid #16a34a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.1);
    }
    .adm-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .adm-tbtn { padding: 8px 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .adm-tbtn.active { background: #16a34a; color: white; border-color: #16a34a; }

    .adm-section { display: none; }
    .adm-section.active { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .form-grid input, .form-grid select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
    .btn-green { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* ফিল্টারিং সেকশন */
    .filter-card { background: white; padding: 16px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .filter-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }

    .exam-toggles { display: flex; gap: 8px; margin-bottom: 14px; }
    .exam-btn { flex: 1; padding: 8px; border: 1.5px solid #e2e8f0; background: #f8fafc; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center; }
    .exam-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }

    .scroll-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .pill { white-space: nowrap; padding: 6px 14px; border: 1px solid #cbd5e1; background: white; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: #334155; }
    .pill.active { background: var(--primary); color: white; border-color: var(--primary); }

    .search-bar { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; outline: none; }

    /* ক্লাস গ্রিড */
    .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .class-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #f1f5f9; box-shadow: 0 3px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
    .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .card-info { padding: 14px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge-line { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge-tag { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; }
    .b-exam { background: #fee2e2; color: #991b1b; }
    .b-sub { background: #e0e7ff; color: #3730a3; }

    .class-title { font-size: 14.5px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; color: var(--dark); }
    .action-row { display: flex; gap: 6px; }
    .btn-pdf { flex: 1; text-align: center; padding: 8px; background: #f8fafc; color: var(--primary); border: 1px solid var(--primary-light); border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 700; }
    .btn-del { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="brand-logo-wrap">
        <img src="logo.png" alt="Logo" id="siteLogo">
      </div>
      <div class="brand-title">
        <h1>Roy dar Coaching</h1>
        <p>Govt. Exam Prep • ডিজিটাল স্টাডি পোর্টাল</p>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- অ্যাডমিন লগইন বক্স -->
    <div class="admin-card-box" id="adminLoginBox">
      <h3 style="font-size: 15px; color: var(--primary);">🔒 অ্যাডমিন জোন লগইন</h3>
      <form onsubmit="event.preventDefault(); processLogin();" class="login-row">
        <input type="email" id="admEmail" placeholder="ইমেইল দিন" value="roydarcoaching@gmail.com" required>
        <input type="password" id="admPass" placeholder="পাসওয়ার্ড দিন" value="12345" required>
        <button type="submit" class="btn-login">লগইন করুন</button>
      </form>
      <div id="loginFeedback" class="status-msg"></div>
    </div>

    <!-- মূল অ্যাডমিন প্যানেল -->
    <div id="adminMasterArea">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="color: #16a34a; font-size: 16px;">👑 স্বাগতম অ্যাডমিন! আপনার ড্যাশবোর্ড সচল রয়েছে</h3>
        <button onclick="processLogout()" style="background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">লগআউট</button>
      </div>

      <div class="adm-tabs">
        <button class="adm-tbtn active" onclick="switchTab('tabUpload', this)">ক্লাস আপলোড</button>
        <button class="adm-tbtn" onclick="switchTab('tabSubject', this)">নতুন বিষয় যোগ</button>
        <button class="adm-tbtn" onclick="switchTab('tabTopic', this)">নতুন চ্যাপ্টার যোগ</button>
        <button class="adm-tbtn" onclick="switchTab('tabLogo', this)">লোগো পরিবর্তন</button>
      </div>

      <!-- ক্লাস আপলোড -->
      <div class="adm-section active" id="tabUpload">
        <div class="form-grid">
          <select id="upExam">
            <option value="oneday">One Day Exams</option>
            <option value="civil">Civil Services</option>
            <option value="oneday civil">Both Exams</option>
          </select>
          <select id="upSub" onchange="syncTopicsDropdown()"></select>
          <select id="upTopic"></select>
          <input type="text" id="upTitle" placeholder="ক্লাসের অধ্যায়ের নাম">
          <input type="text" id="upVideo" placeholder="YouTube Video ID বা লিংক">
          <input type="text" id="upPdf" placeholder="Google Drive PDF লিংক">
        </div>
        <button class="btn-green" onclick="saveNewClass()">+ ক্লাসটি পোর্টালে যুক্ত করুন</button>
      </div>

      <!-- নতুন বিষয় -->
      <div class="adm-section" id="tabSubject">
        <div class="form-grid">
          <input type="text" id="newSubKey" placeholder="আইডি (যেমন: computer)">
          <input type="text" id="newSubName" placeholder="বিষয়ের নাম (যেমন: কম্পিউটার)">
        </div>
        <button class="btn-green" onclick="saveNewSubject()">+ নতুন বিষয় সেভ করুন</button>
      </div>

      <!-- চ্যাপ্টার যোগ -->
      <div class="adm-section" id="tabTopic">
        <div class="form-grid">
          <select id="targetSubSelect"></select>
          <input type="text" id="newTopKey" placeholder="চ্যাপ্টার আইডি (যেমন: hardware)">
          <input type="text" id="newTopName" placeholder="চ্যাপ্টারের নাম (যেমন: হার্ডওয়্যার)">
        </div>
        <button class="btn-green" onclick="saveNewTopic()">+ নতুন চ্যাপ্টার সেভ করুন</button>
      </div>

      <!-- লোগো -->
      <div class="adm-section" id="tabLogo">
        <div class="form-grid">
          <input type="text" id="logoUrlField" placeholder="নতুন ছবির অনলাইন বা গুগল ড্রাইভ লিংক">
        </div>
        <button class="btn-green" onclick="saveNewLogo()">লোগো আপডেট করুন</button>
      </div>
    </div>

    <!-- ফিল্টারিং সেকশন -->
    <div class="filter-card">
      <span class="filter-title">কোর্স ক্যাটাগরি</span>
      <div class="exam-toggles">
        <button class="exam-btn active" onclick="setExam('all', this)">সব এক্সাম</button>
        <button class="exam-btn" onclick="setExam('oneday', this)">One Day Exams</button>
        <button class="exam-btn" onclick="setExam('civil', this)">Civil Services</button>
      </div>

      <span class="filter-title">বিষয় নির্বাচন করুন</span>
      <div class="scroll-row" id="subButtonBar"></div>

      <span class="filter-title" id="topicBarHead" style="display:none;">উপ-শাখা (Sub-Topics)</span>
      <div class="scroll-row" id="topButtonBar"></div>

      <input type="text" id="srchInput" class="search-bar" placeholder="🔍 যেকোনো ক্লাসের নাম দিয়ে সরাসরি খুঁজুন..." onkeyup="drawClasses()">
    </div>

    <!-- ক্লাস ডিসপ্লে গ্রিড -->
    <div class="classes-grid" id="classDisplayArea"></div>

  </div>

  <script>
    const MASTER_EMAIL = "roydarcoaching@gmail.com";
    const MASTER_PASS = "12345";
    let isLogged = false;

    let subjectsData = JSON.parse(localStorage.getItem('roy_subs_data')) || {
      history: { name: 'ইতিহাস', topics: [ { id: 'ancient', name: 'Ancient India' }, { id: 'medieval', name: 'Medieval India' }, { id: 'modern', name: 'Modern India' } ] },
      geography: { name: 'ভূগোল', topics: [ { id: 'wb_geo', name: 'West Bengal Geography' }, { id: 'indian_geo', name: 'Indian Geography' } ] },
      polity: { name: 'সংবিধান', topics: [ { id: 'constitution', name: 'সংবিধান ও ধারা' } ] },
      math: { name: 'গণিত', topics: [ { id: 'arithmetic', name: 'পাটিগণিত' }, { id: 'algebra', name: 'বীজগণিত' } ] },
      science: { name: 'বিজ্ঞান', topics: [ { id: 'biology', name: 'জীববিজ্ঞান' }, { id: 'physics', name: 'পদার্থবিজ্ঞান' } ] },
      static_gk: { name: 'স্ট্যাটিক জিকে', topics: [ { id: 'art_culture', name: 'শিল্প ও সংস্কৃতি' }, { id: 'first_india', name: 'ভারতের প্রথম' } ] }
    };

    let classList = JSON.parse(localStorage.getItem('roy_class_data')) || [
      {
        id: '1',
        exam: 'oneday civil',
        sub: 'history',
        topic: 'ancient',
        title: 'সিন্ধু সভ্যতা ও হরপ্পা সংস্কৃতি (Ancient History)',
        videoId: 'M7lc1UVf-VE',
        pdfUrl: '#'
      }
    ];

    let filterOpt = { exam: 'all', sub: 'all', topic: 'all' };

    window.onload = function() {
      const savedLogo = localStorage.getItem('roy_site_logo');
      if (savedLogo) document.getElementById("siteLogo").src = savedLogo;

      if (localStorage.getItem("roy_admin_logged") === "yes") {
        isLogged = true;
      }
      refreshAdminUI();
      buildSubButtons();
      syncSelects();
      drawClasses();
    };

    function processLogin() {
      const em = document.getElementById("admEmail").value.trim().toLowerCase();
      const ps = document.getElementById("admPass").value.trim();
      const feedback = document.getElementById("loginFeedback");

      if (em === MASTER_EMAIL && ps === MASTER_PASS) {
        isLogged = true;
        localStorage.setItem("roy_admin_logged", "yes");
        feedback.style.color = "green";
        feedback.innerText = "লগইন সফল হয়েছে! ড্যাশবোর্ড লোড হচ্ছে...";
        setTimeout(() => {
          refreshAdminUI();
        }, 300);
      } else {
        feedback.style.color = "red";
        feedback.innerText = "ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড 12345 দিন।";
      }
    }

    function processLogout() {
      isLogged = false;
      localStorage.removeItem("roy_admin_logged");
      document.getElementById("loginFeedback").innerText = "";
      refreshAdminUI();
    }

    function refreshAdminUI() {
      const pnl = document.getElementById("adminMasterArea");
      const loginBox = document.getElementById("adminLoginBox");

      if (isLogged) {
        pnl.style.display = "block";
        loginBox.style.display = "none";
      } else {
        pnl.style.display = "none";
        loginBox.style.display = "block";
      }
      drawClasses();
    }

    function buildSubButtons() {
      const bar = document.getElementById("subButtonBar");
      let h = `<button class="pill ${filterOpt.sub === 'all' ? 'active' : ''}" onclick="selectSub('all', this)">সব বিষয়</button>`;
      for (let k in subjectsData) {
        h += `<button class="pill ${filterOpt.sub === k ? 'active' : ''}" onclick="selectSub('${k}', this)">${subjectsData[k].name}</button>`;
      }
      bar.innerHTML = h;
    }

    function selectSub(k, btn) {
      document.querySelectorAll('#subButtonBar .pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterOpt.sub = k;
      filterOpt.topic = 'all';

      const head = document.getElementById("topicBarHead");
      const bar = document.getElementById("topButtonBar");
      bar.innerHTML = '';

      if (k === 'all' || !subjectsData[k] || !subjectsData[k].topics) {
        head.style.display = 'none';
      } else {
        head.style.display = 'block';
        let h = `<button class="pill active" onclick="selectTopic('all', this)">সব অধ্যায়</button>`;
        subjectsData[k].topics.forEach(t => {
          h += `<button class="pill" onclick="selectTopic('${t.id}', this)">${t.name}</button>`;
        });
        bar.innerHTML = h;
      }
      drawClasses();
    }

    function selectTopic(t, btn) {
      document.querySelectorAll('#topButtonBar .pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterOpt.topic = t;
      drawClasses();
    }

    function setExam(e, btn) {
      document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterOpt.exam = e;
      drawClasses();
    }

    function drawClasses() {
      const q = document.getElementById("srchInput").value.toLowerCase();
      const grid = document.getElementById("classDisplayArea");
      grid.innerHTML = '';

      if (classList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 30px;">কোনো ক্লাস নেই।</p>';
        return;
      }

      classList.forEach(c => {
        const mExam = (filterOpt.exam === 'all' || c.exam.includes(filterOpt.exam));
        const mSub = (filterOpt.sub === 'all' || c.sub === filterOpt.sub);
        const mTop = (filterOpt.topic === 'all' || c.topic === filterOpt.topic);
        const mSrch = c.title.toLowerCase().includes(q);

        if (mExam && mSub && mTop && mSrch) {
          const sName = subjectsData[c.sub] ? subjectsData[c.sub].name : c.sub;
          grid.innerHTML += `
            <div class="class-card">
              <div class="video-wrap">
                <iframe src="https://www.youtube.com/embed/${c.videoId}" allowfullscreen></iframe>
              </div>
              <div class="card-info">
                <div>
                  <div class="badge-line">
                    <span class="badge-tag b-exam">${c.exam}</span>
                    <span class="badge-tag b-sub">${sName}</span>
                  </div>
                  <h3 class="class-title">${c.title}</h3>
                </div>
                <div class="action-row">
                  <a href="${c.pdfUrl}" target="_blank" class="btn-pdf">PDF নোটস</a>
                  ${isLogged ? `<button class="btn-del" onclick="deleteClassItem('${c.id}')">মুছুন</button>` : ''}
                </div>
              </div>
            </div>
          `;
        }
      });
    }

    function saveNewClass() {
      const tit = document.getElementById("upTitle").value.trim();
      let vid = document.getElementById("upVideo").value.trim();
      const pdf = document.getElementById("upPdf").value.trim();

      if (!tit || !vid) {
        alert("ক্লাসের নাম ও ভিডিও লিংক দিন!");
        return;
      }

      if (vid.includes("v=")) vid = vid.split("v=")[1].split("&")[0];
      else if (vid.includes("youtu.be/")) vid = vid.split("youtu.be/")[1].split("?")[0];

      classList.unshift({
        id: Date.now().toString(),
        exam: document.getElementById("upExam").value,
        sub: document.getElementById("upSub").value,
        topic: document.getElementById("upTopic").value,
        title: tit,
        videoId: vid,
        pdfUrl: pdf || '#'
      });

      localStorage.setItem('roy_class_data', JSON.stringify(classList));
      document.getElementById("upTitle").value = '';
      document.getElementById("upVideo").value = '';
      document.getElementById("upPdf").value = '';
      drawClasses();
    }

    function deleteClassItem(id) {
      if (confirm("ক্লাসটি মুছে ফেলতে চান?")) {
        classList = classList.filter(c => c.id !== id);
        localStorage.setItem('roy_class_data', JSON.stringify(classList));
        drawClasses();
      }
    }

    function saveNewSubject() {
      const k = document.getElementById("newSubKey").value.trim().toLowerCase().replace(/\s+/g, '_');
      const n = document.getElementById("newSubName").value.trim();
      if (!k || !n) return;

      subjectsData[k] = { name: n, topics: [] };
      localStorage.setItem('roy_subs_data', JSON.stringify(subjectsData));
      document.getElementById("newSubKey").value = '';
      document.getElementById("newSubName").value = '';
      buildSubButtons();
      syncSelects();
    }

    function saveNewTopic() {
      const sub = document.getElementById("targetSubSelect").value;
      const k = document.getElementById("newTopKey").value.trim().toLowerCase().replace(/\s+/g, '_');
      const n = document.getElementById("newTopName").value.trim();
      if (!k || !n) return;

      if (!subjectsData[sub].topics) subjectsData[sub].topics = [];
      subjectsData[sub].topics.push({ id: k, name: n });
      localStorage.setItem('roy_subs_data', JSON.stringify(subjectsData));
      document.getElementById("newTopKey").
