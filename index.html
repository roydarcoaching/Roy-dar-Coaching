<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roy dar Coaching - ডায়নামিক এডু-পোর্টাল</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #4338ca;
      --primary-dark: #312e81;
      --primary-light: #e0e7ff;
      --accent: #f59e0b;
      --dark: #0f172a;
      --light-bg: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
    body { background-color: var(--light-bg); color: var(--dark); padding-bottom: 80px; }

    /* টপবার */
    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; }
    .brand-logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      overflow: hidden;
      border: 2px solid #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title h1 { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .brand-title p { font-size: 11px; color: #cbd5e1; }

    .btn-auth {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .container { max-width: 1150px; margin: 20px auto; padding: 0 14px; }

    /* অ্যাডমিন ড্যাশবোর্ড */
    .master-admin-panel {
      background: white;
      border: 2px solid #6366f1;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.1);
      display: none;
    }
    .admin-tab-btns { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
    .adm-tab { padding: 8px 14px; background: #f1f5f9; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: #475569; }
    .adm-tab.active { background: var(--primary); color: white; }

    .admin-sub-section { display: none; }
    .admin-sub-section.active { display: block; }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .form-row input, .form-row select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; background: #fdfdfd; }
    .btn-action { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }

    /* ফিল্টার সেকশন */
    .filter-card { background: white; padding: 16px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .filter-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
    
    .exam-toggles { display: flex; gap: 8px; margin-bottom: 14px; }
    .exam-btn { flex: 1; padding: 8px; border: 1.5px solid #e2e8f0; background: #f8fafc; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: #475569; text-align: center; }
    .exam-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }

    .scroll-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .pill { white-space: nowrap; padding: 6px 14px; border: 1px solid #cbd5e1; background: white; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: #334155; }
    .pill.active { background: var(--primary); color: white; border-color: var(--primary); }

    .search-bar { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; outline: none; margin-top: 4px; }

    /* ক্লাস গ্রিড */
    .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .class-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #f1f5f9; box-shadow: 0 3px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
    .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .card-info { padding: 14px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge-line { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge-tag { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; }
    .b-exam { background: #fee2e2; color: #991b1b; }
    .b-sub { background: #e0e7ff; color: #3730a3; }

    .class-title { font-size: 14.5px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; color: var(--dark); }
    .action-row { display: flex; gap: 6px; }
    .btn-pdf { flex: 1; text-align: center; padding: 8px; background: #f8fafc; color: var(--primary); border: 1px solid var(--primary-light); border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 700; }
    .btn-delete { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

    /* লগইন মোডাল */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .modal-box {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-box h3 { font-size: 18px; margin-bottom: 14px; font-weight: 800; }
    .modal-box input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 14px; }
  </style>
</head>
<body>

  <!-- হেডার -->
  <header>
    <div class="brand-box">
      <div class="brand-logo-wrap">
        <img src="logo.png" alt="Logo" id="siteLogo">
      </div>
      <div class="brand-title">
        <h1>Roy dar Coaching</h1>
        <p>Govt. Exam Prep • ডিজিটাল স্টাডি পোর্টাল</p>
      </div>
    </div>
    <div id="authContainer">
      <button type="button" class="btn-auth" id="loginBtnTrigger" onclick="openLoginModal()">
        <i class="fa-solid fa-lock"></i> অ্যাডমিন লগইন
      </button>
    </div>
  </header>

  <div class="container">

    <!-- অ্যাডমিন ড্যাশবোর্ড -->
    <div class="master-admin-panel" id="masterAdminPanel">
      <div class="admin-tab-btns">
        <button class="adm-tab active" onclick="switchAdminTab('classesTab', this)"><i class="fa-solid fa-video"></i> ক্লাস আপলোড</button>
        <button class="adm-tab" onclick="switchAdminTab('subjectTab', this)"><i class="fa-solid fa-folder-plus"></i> নতুন সাবজেক্ট তৈরি</button>
        <button class="adm-tab" onclick="switchAdminTab('topicTab', this)"><i class="fa-solid fa-layer-group"></i> নতুন সাব-টপিক যোগ</button>
        <button class="adm-tab" onclick="switchAdminTab('brandingTab', this)"><i class="fa-solid fa-image"></i> লোগো পরিবর্তন</button>
      </div>

      <!-- ক্লাস আপলোড -->
      <div class="admin-sub-section active" id="classesTab">
        <div class="form-row">
          <select id="uploadExam">
            <option value="oneday">One Day Exams</option>
            <option value="civil">Civil Services</option>
            <option value="oneday civil">Both Exams</option>
          </select>
          <select id="uploadSub" onchange="syncUploadSubTopics()"></select>
          <select id="uploadTopic"></select>
          <input type="text" id="uploadTitle" placeholder="ক্লাসের অধ্যায়ের নাম">
          <input type="text" id="uploadVideo" placeholder="YouTube Video ID বা পুরো লিংক">
          <input type="text" id="uploadPdf" placeholder="Google Drive PDF লিংক">
        </div>
        <button class="btn-action" id="btnUpload" onclick="submitNewClass()">+ ক্লাসটি পোর্টালে যুক্ত করুন</button>
      </div>

      <!-- নতুন সাবজেক্ট তৈরি -->
      <div class="admin-sub-section" id="subjectTab">
        <p style="font-size: 13px; color: #64748b; margin-bottom: 8px;">যেকোনো নতুন সাবজেক্ট (যেমন: Bengali, Computer ইত্যাদি) যোগ করুন:</p>
        <div class="form-row">
          <input type="text" id="newSubjectKey" placeholder="সাবজেক্ট আইডি (उदा. computer)">
          <input type="text" id="newSubjectName" placeholder="সাবজেক্টের নাম (उदा. কম্পিউটার)">
        </div>
        <button class="btn-action" onclick="createNewSubject()">+ সাবজেক্ট সেভ করুন</button>
      </div>

      <!-- নতুন সাব-টপিক যোগ -->
      <div class="admin-sub-section" id="topicTab">
        <div class="form-row">
          <select id="targetSubForTopic"></select>
          <input type="text" id="newTopicKey" placeholder="টপিক আইডি (उदा. ms_word)">
          <input type="text" id="newTopicName" placeholder="টপিকের নাম (उदा. MS Word)">
        </div>
        <button class="btn-action" onclick="createNewTopic()">+ সাব-টপিক যোগ করুন</button>
      </div>

      <!-- লোগো পরিবর্তন -->
      <div class="admin-sub-section" id="brandingTab">
        <p style="font-size: 13px; color: #64748b; margin-bottom: 8px;">আপনার যেকোনো ফটোর অনলাইন লিংক বা ড্রাইভের লিংক দিন:</p>
        <div class="form-row">
          <input type="text" id="newLogoUrl" placeholder="ইমেজ লিংক (https://.../my_logo.png)">
        </div>
        <button class="btn-action" onclick="updateLogoUrl()"><i class="fa-solid fa-floppy-disk"></i> লোগো আপডেট করুন</button>
      </div>
    </div>

    <!-- ফিল্টারিং সেকশন -->
    <div class="filter-card">
      <span class="filter-title">কোর্স ক্যাটাগরি</span>
      <div class="exam-toggles">
        <button class="exam-btn active" onclick="setExamMode('all', this)">সব এক্সাম</button>
        <button class="exam-btn" onclick="setExamMode('oneday', this)">One Day Exams</button>
        <button class="exam-btn" onclick="setExamMode('civil', this)">Civil Services</button>
      </div>

      <span class="filter-title">বিষয় নির্বাচন করুন</span>
      <div class="scroll-row" id="publicSubjectBar"></div>

      <span class="filter-title" id="topicHeading" style="display:none;">উপ-শাখা (Sub-Topics)</span>
      <div class="scroll-row" id="publicTopicBar"></div>

      <input type="text" id="searchField" class="search-bar" placeholder="🔍 যেকোনো ক্লাসের নাম দিয়ে সরাসরি খুঁজুন..." onkeyup="renderClassGrid()">
    </div>

    <!-- ক্লাসের গ্রিড -->
    <div class="classes-grid" id="publicClassesGrid"></div>

  </div>

  <!-- লগইন মোডাল বক্স -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <h3>অ্যাডমিন সাইন-ইন</h3>
      <input type="email" id="loginEmail" placeholder="roydarcoaching@gmail.com">
      <input type="password" id="loginPass" placeholder="পাসওয়ার্ড দিন (12345)">
      <button class="btn-action" style="width: 100%; margin-bottom: 8px;" onclick="verifyAdminLogin()">লগইন করুন</button>
      <button class="pill" style="width: 100%; border-radius: 6px; padding: 9px;" onclick="closeLoginModal()">বাতিল</button>
    </div>
  </div>

  <script>
    // মোডাল ওপেন/ক্লোজ (সবার আগে রাখা হলো যাতে টাচ করলেই কাজ করে)
    function openLoginModal() {
      document.getElementById("authModal").style.display = 'flex';
    }
    function closeLoginModal() {
      document.getElementById("authModal").style.display = 'none';
    }

    // অ্যাডমিন আইডি ও পাসওয়ার্ড
    const MASTER_ADMIN_EMAIL = "roydarcoaching@gmail.com";
    const MASTER_ADMIN_PASS = "12345"; // সহজ পাসওয়ার্ড দেওয়া হলো

    let isAdmin = false;

    // ডিফল্ট সাবজেক্ট ও ক্লাস ডেটা
    let subjectsData = JSON.parse(localStorage.getItem('roy_subjects')) || {
      history: { name: 'ইতিহাস', topics: [ { id: 'ancient', name: 'Ancient India' }, { id: 'medieval', name: 'Medieval India' }, { id: 'modern', name: 'Modern India' }, { id: 'inm', name: 'জাতীয় আন্দোলন' } ] },
      geography: { name: 'ভূগোল', topics: [ { id: 'wb_geo', name: 'West Bengal Geography' }, { id: 'indian_geo', name: 'Indian Geography' }, { id: 'physical_geo', name: 'Physical Geo' } ] },
      polity: { name: 'সংবিধান', topics: [ { id: 'constitution', name: 'সংবিধান ও ধারা' }, { id: 'governance', name: 'শাসনব্যবস্থা' } ] },
      math: { name: 'গণিত', topics: [ { id: 'arithmetic', name: 'পাটিগণিত' }, { id: 'algebra', name: 'বীজগণিত' }, { id: 'geometry', name: 'জ্যামিতি ও পরিমিতি' } ] },
      science: { name: 'বিজ্ঞান', topics: [ { id: 'biology', name: 'জীববিজ্ঞান' }, { id: 'physics', name: 'পদার্থবিজ্ঞান' }, { id: 'chemistry', name: 'রসায়ন' } ] },
      static_gk: { name: 'স্ট্যাটিক জিকে', topics: [ { id: 'art_culture', name: 'শিল্প ও সংস্কৃতি' }, { id: 'first_india', name: 'ভারতের প্রথম' }, { id: 'hq_org', name: 'সদর দপ্তর' } ] }
    };

    let siteClasses = JSON.parse(localStorage.getItem('roy_classes')) || [
      {
        id: '1',
        exam: 'oneday civil',
        sub: 'history',
        topic: 'ancient',
        title: 'সিন্ধু সভ্যতা ও নগর পরিকল্পনা (Indus Valley)',
        videoId: 'M7lc1UVf-VE',
        pdfUrl: '#'
      }
    ];

    let activeFilter = { exam: 'all', sub: 'all', topic: 'all' };

    window.onload = function() {
      // সেভ করা লোগো থাকলে বসানো
      const savedLogo = localStorage.getItem('roy_custom_logo');
      if (savedLogo) {
        document.getElementById("siteLogo").src = savedLogo;
      }

      buildSubjectUI();
      syncAdminSubjectSelects();
      checkExistingSession();
      renderClassGrid();
    };

    function buildSubjectUI() {
      const subBar = document.getElementById("publicSubjectBar");
      let html = `<button class="pill ${activeFilter.sub === 'all' ? 'active' : ''}" onclick="filterBySubject('all', this)">সব বিষয়</button>`;
      for (let key in subjectsData) {
        html += `<button class="pill ${activeFilter.sub === key ? 'active' : ''}" onclick="filterBySubject('${key}', this)">${subjectsData[key].name}</button>`;
      }
      subBar.innerHTML = html;
    }

    function filterBySubject(subKey, btn) {
      document.querySelectorAll('#publicSubjectBar .pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter.sub = subKey;
      activeFilter.topic = 'all';

      const topicHeading = document.getElementById("topicHeading");
      const topicBar = document.getElementById("publicTopicBar");
      topicBar.innerHTML = '';

      if (subKey === 'all' || !subjectsData[subKey] || !subjectsData[subKey].topics) {
        topicHeading.style.display = 'none';
      } else {
        topicHeading.style.display = 'block';
        let html = `<button class="pill active" onclick="filterByTopic('all', this)">সব অধ্যায়</button>`;
        subjectsData[subKey].topics.forEach(t => {
          html += `<button class="pill" onclick="filterByTopic('${t.id}', this)">${t.name}</button>`;
        });
        topicBar.innerHTML = html;
      }
      renderClassGrid();
    }

    function filterByTopic(topicId, btn) {
      document.querySelectorAll('#publicTopicBar .pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter.topic = topicId;
      renderClassGrid();
    }

    function setExamMode(mode, btn) {
      document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter.exam = mode;
      renderClassGrid();
    }

    function renderClassGrid() {
      const q = document.getElementById("searchField").value.toLowerCase();
      const grid = document.getElementById("publicClassesGrid");
      grid.innerHTML = '';

      if (siteClasses.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">কোনো ক্লাস পাওয়া যায়নি।</p>';
        return;
      }

      siteClasses.forEach(c => {
        const matchExam = (activeFilter.exam === 'all' || c.exam.includes(activeFilter.exam));
        const matchSub = (activeFilter.sub === 'all' || c.sub === activeFilter.sub);
        const matchTopic = (activeFilter.topic === 'all' || c.topic === activeFilter.topic);
        const matchTitle = c.title.toLowerCase().includes(q);

        if (matchExam && matchSub && matchTopic && matchTitle) {
          const subName = subjectsData[c.sub] ? subjectsData[c.sub].name : c.sub;
          grid.innerHTML += `
            <div class="class-card">
              <div class="video-wrap">
                <iframe src="https://www.youtube.com/embed/${c.videoId}" allowfullscreen></iframe>
              </div>
              <div class="card-info">
                <div>
                  <div class="badge-line">
                    <span class="badge-tag b-exam">${c.exam}</span>
                    <span class="badge-tag b-sub">${subName}</span>
                  </div>
                  <h3 class="class-title">${c.title}</h3>
                </div>
                <div class="action-row">
                  <a href="${c.pdfUrl}" target="_blank" class="btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF নোটস</a>
                  ${isAdmin ? `<button class="btn-delete" onclick="deleteClassDoc('${c.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
              </div>
            </div>
          `;
        }
      });
    }

    function submitNewClass() {
      const title = document.getElementById("uploadTitle").value.trim();
      let rawVideo = document.getElementById("uploadVideo").value.trim();
      const pdf = document.getElementById("uploadPdf").value.trim();

      if (!title || !rawVideo) {
        alert("দয়া করে ক্লাসের নাম ও ভিডিও আইডি/লিংক দিন!");
        return;
      }

      let videoId = rawVideo;
      if (rawVideo.includes("v=")) videoId = rawVideo.split("v=")[1].split("&")[0];
      else if (rawVideo.includes("youtu.be/")) videoId = rawVideo.split("youtu.be/")[1].split("?")[0];

      const newEntry = {
        id: Date.now().toString(),
        exam: document.getElementById("uploadExam").value,
        sub: document.getElementById("uploadSub").value,
        topic: document.getElementById("uploadTopic").value,
        title: title,
        videoId: videoId,
        pdfUrl: pdf || '#'
      };

      siteClasses.unshift(newEntry);
      localStorage.setItem('roy_classes', JSON.stringify(siteClasses));

      document.getElementById("uploadTitle").value = '';
      document.getElementById("uploadVideo").value = '';
      document.getElementById("uploadPdf").value = '';

      alert("ক্লাসটি সফলভাবে যোগ হয়েছে!");
